<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Search Everywhere Learning Lab | Lamark</title>
  <meta name="description" content="A live, collaborative Search Everywhere learning workshop for the Lamark SEO team.">
  <link rel="stylesheet" href="assets/styles.css?v=2.0.0">
</head>
<body>
  <header class="app-header">
    <div class="brand-lockup">
      <button class="icon-button hidden" id="mobileMenuButton" type="button" aria-label="Open workshop navigation">☰</button>
      <div class="brand-mark" aria-hidden="true">L</div>
      <div class="brand-copy">
        <strong>Search Everywhere Lab</strong>
        <span>Lamark SEO Learning Workshop</span>
      </div>
    </div>

    <div class="header-center">
      <div class="connection-pill" id="connectionPill" data-state="idle" title="Connection status">
        <span class="connection-dot" aria-hidden="true"></span>
        <span id="connectionText">Not connected</span>
      </div>
      <div class="room-pill hidden" id="roomPill">
        <span>Room</span>
        <code id="roomCodeHeader">------</code>
      </div>
      <div class="timer-pill hidden" id="timerPill">
        <span>Activity</span>
        <strong id="timerDisplay">00:00</strong>
      </div>
    </div>

    <div class="header-actions">
      <div class="avatar-stack" id="avatarStack" aria-label="Participants"></div>
      <button class="icon-button" id="copyRoomButton" type="button" title="Copy room code" aria-label="Copy room code">⧉</button>
      <button class="icon-button" id="fullscreenButton" type="button" title="Full screen" aria-label="Enter full screen">⛶</button>
    </div>
  </header>

  <aside class="stage-rail" id="stageRail" aria-label="Workshop stages">
    <div class="rail-progress">
      <div class="rail-progress-top"><span>Learning journey</span><span id="progressLabel">0%</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <nav class="stage-nav" id="stageNav"></nav>
    <div class="rail-follow hidden" id="followPanel">
      <div class="toggle-row">
        <span>Follow facilitator</span>
        <label class="switch">
          <input id="followFacilitator" type="checkbox" checked>
          <span class="switch-slider"></span>
        </label>
      </div>
      <p class="rail-note">Turn this off to review another lesson without changing the shared room.</p>
    </div>
  </aside>

  <main class="app-main" id="stageRoot" aria-live="polite"></main>

  <div class="facilitator-dock" id="facilitatorDock">
    <div class="dock-stage">
      <strong id="dockStageTitle">The Search Fracture</strong>
      <span id="dockStageMeta">Stage 1 of 11</span>
    </div>
    <div class="reactions" aria-label="Live reactions">
      <button class="reaction-button" data-reaction="💡" type="button" title="Good insight">💡</button>
      <button class="reaction-button" data-reaction="👏" type="button" title="Applause">👏</button>
      <button class="reaction-button" data-reaction="🤔" type="button" title="Thinking">🤔</button>
      <button class="reaction-button" data-reaction="🔥" type="button" title="Strong idea">🔥</button>
    </div>
    <div class="dock-controls">
      <button class="btn btn-secondary btn-small" id="timerFiveButton" type="button">5 min</button>
      <button class="btn btn-secondary btn-small" id="timerStopButton" type="button">Stop timer</button>
      <button class="btn btn-secondary btn-small" id="previousStageButton" type="button">← Back</button>
      <button class="btn btn-primary btn-small" id="nextStageButton" type="button">Next →</button>
    </div>
  </div>

  <div class="cursor-layer" id="cursorLayer" aria-hidden="true"></div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script src="assets/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/content.js?v=2.0.0"></script>
  <script src="assets/realtime.js?v=2.0.0"></script>
  <script src="assets/app.js?v=2.0.0"></script>
</body>
</html>
